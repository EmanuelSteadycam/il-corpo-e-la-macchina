<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Il Corpo e la Macchina | STEADYCAM</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Sfondo fisso -->
    <div class="background-layer">
        <img src="background.jpg" alt="Asfalto">
    </div>

    <!-- Testo "STEADYCAM PRESENTA" che appare dall'alto -->
    <div class="presenta-layer" id="presentaLayer">
        <h2 class="presenta-text">Il Centro Steadycam presenta</h2>
    </div>

    <!-- Testo sull'asfalto -->
    <div class="text-layer" id="textLayer">
        <h1 class="asphalt-text">IL CORPO E<br>LA MACCHINA</h1>
    </div>

    <!-- Uomo che entra da destra -->
    <div class="man-layer" id="manLayer">
        <img src="man.png" alt="Uomo">
    </div>

    <!-- Auto che scende dall'alto -->
    <div class="car-layer" id="carLayer">
        <img src="car.png" alt="Auto">
    </div>

    <!-- Spazio per scrollare -->
    <div style="height: 300vh;"></div>

    <script src="script.js"></script>
</body>
</html>
