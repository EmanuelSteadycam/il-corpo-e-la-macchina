<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Il Corpo e la Macchina - Centro Steadycam</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Contenitore che simula schermo mobile anche su desktop -->
    <div class="phone-container">
        <!-- Immagine di sfondo fissa -->
        <div class="background-fixed">
            <img src="landing01.jpg" alt="">
        </div>

        <!-- Overlay gradient -->
        <div class="overlay-gradient"></div>

        <!-- Content che scrolla -->
        <div class="content-wrapper">
            <!-- Testo "STEADYCAM PRESENTA" che scende dall'alto -->
            <div class="presenta-layer" id="presentaLayer">
                <h2 class="presenta-text">Il Centro Steadycam presenta</h2>
            </div>

            <!-- Titolo principale sempre visibile -->
            <div class="title-layer">
                <h1 class="main-title">IL CORPO E<br>LA MACCHINA</h1>
            </div>

            <!-- Schede eventi che appaiono scrollando -->
            <div class="cards-container" id="cardsContainer">
                <div class="event-card">
                    <div class="card-date">12 MARZO 2026</div>
                    <div class="card-title">Social Media</div>
                    <div class="card-subtitle">Tecniche di resistenza digitale</div>
                </div>
                
                <div class="event-card">
                    <div class="card-date">9-10 APRILE 2026</div>
                    <div class="card-title">Intelligenza Artificiale</div>
                    <div class="card-subtitle">Creare per apprendere</div>
                </div>
                
                <div class="event-card">
                    <div class="card-date">12-13 MAGGIO 2026</div>
                    <div class="card-title">Gaming e benessere</div>
                    <div class="card-subtitle">Salute digitale e consapevolezza</div>
                </div>
            </div>

            <!-- Footer con loghi -->
            <footer class="footer-logos">
                <img src="footer_loghi.png" alt="Partner logos" class="footer-image">
            </footer>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
