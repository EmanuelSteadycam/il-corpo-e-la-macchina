<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Il Corpo e la Macchina - Centro Steadycam</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Contenitore principale -->
    <div class="phone-container">
        
        <!-- SEZIONE 1: Landing con immagine -->
        <section class="section-one">
            <!-- Immagine di sfondo fissa -->
            <div class="background-fixed">
                <img src="landing01.jpg" alt="">
            </div>

            <!-- Content overlay -->
            <div class="content-overlay">
                <!-- "Il Centro Steadycam presenta" - entra da sinistra subito -->
                <div class="presenta-layer" id="presentaLayer">
                    <h2 class="presenta-text">Il Centro Steadycam presenta:</h2>
                </div>

                <!-- Titolo + Sottotitolo - basso a sinistra, appare scrollando 10px -->
                <div class="title-group" id="titleGroup">
                    <h1 class="main-title">IL CORPO<br>E LA MACCHINA</h1>
                    <p class="subtitle">Mappe di cultura digitale</p>
                </div>
            </div>
        </section>

        <!-- SEZIONE 2: Bottoni iscrizioni (sfondo nero) -->
        <section class="section-two">
            <div class="section-two-content">
                <h2 class="section-title">Iscriviti agli eventi</h2>
                
                <div class="buttons-container">
                    <a href="#" class="event-button">
                        <span class="button-date">12 MARZO</span>
                        <span class="button-title">Social Media</span>
                    </a>
                    
                    <a href="#" class="event-button">
                        <span class="button-date">9-10 APRILE</span>
                        <span class="button-title">Intelligenza Artificiale</span>
                    </a>
                    
                    <a href="#" class="event-button">
                        <span class="button-date">12-13 MAGGIO</span>
                        <span class="button-title">Gaming e benessere</span>
                    </a>
                </div>
            </div>
        </section>

        <!-- FOOTER: Loghi -->
        <footer class="footer-logos">
            <img src="footer_loghi.png" alt="Partner logos" class="footer-image">
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
